name: SwiftUICamera2026-AVFoundation
options:
  bundleIdPrefix: com.wesleyyyy2712
  deploymentTarget:
    iOS: "17.0"
targets:
  SwiftUICamera2026-AVFoundation:
    type: application
    platform: iOS
    sources:
      - path: SwiftUICamera2026-AVFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleyyyy2712.SwiftUICamera
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "A câmera é necessária para tirar fotos e gravar vídeos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "O microfone é necessário para gravar vídeos com áudio."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Permita salvar fotos e vídeos capturados na sua biblioteca."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
