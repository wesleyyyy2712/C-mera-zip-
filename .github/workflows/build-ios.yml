name: Build SwiftUI Camera IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'SwiftUICamera2026-AVFoundation/**'
      - 'SwiftUICamera2026-AVFoundation.xcodeproj/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project SwiftUICamera2026-AVFoundation.xcodeproj \
            -scheme SwiftUICamera2026-AVFoundation \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 build
      - name: Package IPA
        run: |
          rm -rf Payload SwiftUICamera-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SwiftUICamera2026-AVFoundation.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload SwiftUICamera-unsigned.ipa
      - name: Validate package
        run: |
          unzip -t SwiftUICamera-unsigned.ipa
          test -d Payload/SwiftUICamera2026-AVFoundation.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/SwiftUICamera2026-AVFoundation.app/Info.plist
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftUICamera-unsigned-ipa
          path: SwiftUICamera-unsigned.ipa
