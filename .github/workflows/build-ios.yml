name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-camera-clone/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-camera-clone
        run: |
          xcodegen generate
          # XcodeGen recente gera objectVersion 77 (Xcode 16),
          # enquanto o runner macOS-14 usa Xcode 15.4.
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' CameraClone.xcodeproj/project.pbxproj
      - name: Build unsigned archive
        working-directory: ios-camera-clone
        run: xcodebuild -project CameraClone.xcodeproj -scheme CameraClone -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios-camera-clone/build/Build/Products/Release-iphoneos/CameraClone.app Payload/
          zip -qry CameraClone-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraClone-unsigned-ipa
          path: CameraClone-unsigned.ipa
